version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
      time: "17:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "17:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
      time: "17:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: "build(deps)"

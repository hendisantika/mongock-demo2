services:
  mongodb:
    image: mongo:8.0.4
    container_name: mongock-demo2
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    driver: local
